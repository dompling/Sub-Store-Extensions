name: Publish extensions

run-name: Release extensions from ${{ github.event_name == 'workflow_dispatch' && inputs.base_branch || github.ref_name }}

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      extension_id:
        description: Extension ID beneath extensions/
        required: true
        default: org.substore.config-generator
        type: string
      base_branch:
        description: Branch containing the reviewed release source
        required: true
        default: main
        type: string
      version_bump:
        description: Semantic version increment calculated from the published catalog entry
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

concurrency:
  group: publish-extension-${{ github.event_name == 'workflow_dispatch' && inputs.base_branch || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Verify and publish changed extensions
    if: >-
      github.event_name != 'push' ||
      !contains(github.event.head_commit.message, '[extension-release]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RELEASE_BASE_BRANCH: ${{ github.event_name == 'workflow_dispatch' && inputs.base_branch || github.ref_name }}
    steps:
      - name: Check out release source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.base_branch || github.sha }}
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PUBLISH_TOKEN || github.token }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Select extensions to release
        id: selection
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_EXTENSION_ID: ${{ inputs.extension_id }}
        run: |
          source_sha="$(git rev-parse HEAD)"
          selection_args=(
            --head "$source_sha"
            --github-output "$GITHUB_OUTPUT"
          )
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            selection_args+=(--extension "$MANUAL_EXTENSION_ID")
          fi
          node scripts/select-release-extensions.mjs "${selection_args[@]}"

      - name: Summarize empty release selection
        if: steps.selection.outputs.release_count == '0'
        run: |
          echo "### No extension release required" >> "$GITHUB_STEP_SUMMARY"
          echo "Every extension is published and unchanged since its own release tag." >> "$GITHUB_STEP_SUMMARY"

      - name: Enable pnpm
        if: steps.selection.outputs.release_count != '0'
        run: corepack enable

      - name: Install locked dependencies
        if: steps.selection.outputs.release_count != '0'
        run: corepack pnpm install --frozen-lockfile

      - name: Prepare release metadata
        id: metadata
        if: steps.selection.outputs.release_count != '0'
        shell: bash
        env:
          EXTENSION_IDS_JSON: ${{ steps.selection.outputs.extension_ids }}
          RELEASE_BUMP: ${{ github.event_name == 'workflow_dispatch' && inputs.version_bump || 'patch' }}
          SOURCE_SHA: ${{ steps.selection.outputs.source_sha }}
        run: |
          release_time="$(git show -s --format=%cI "$SOURCE_SHA")"
          corepack pnpm release:prepare-batch -- \
            --extensions-json "$EXTENSION_IDS_JSON" \
            --bump "$RELEASE_BUMP" \
            --installed-at "$release_time" \
            --metadata "$RUNNER_TEMP/extension-releases.json" \
            --github-output "$GITHUB_OUTPUT"

      - name: Build and verify release candidates
        if: steps.selection.outputs.release_count != '0'
        shell: bash
        env:
          EXTENSION_IDS: ${{ steps.metadata.outputs.extension_ids }}
          SUB_STORE_EXTENSION_RELEASE_TAGS: ${{ steps.metadata.outputs.release_tags_json }}
        run: |
          read -r -a extension_ids <<< "$EXTENSION_IDS"
          release_args=()
          for extension_id in "${extension_ids[@]}"; do
            release_args+=(--extension "$extension_id")
          done
          corepack pnpm release:build -- "${release_args[@]}"
          git diff --check

      - name: Upload release candidates
        if: steps.selection.outputs.release_count != '0'
        uses: actions/upload-artifact@v4
        with:
          name: extension-releases-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build
            dist/packages
            packages
            repository/catalog.json
            repository/packages
            repository/releases
          if-no-files-found: error
          retention-days: 14

      - name: Commit release candidates
        id: commit
        if: steps.selection.outputs.release_count != '0'
        shell: bash
        env:
          RELEASE_COUNT: ${{ steps.metadata.outputs.release_count }}
          RELEASE_SUMMARY: ${{ steps.metadata.outputs.release_summary }}
        run: |
          if git diff --quiet; then
            echo "Release produced no tracked changes." >&2
            exit 1
          fi
          base_sha="$(git rev-parse HEAD)"
          echo "base_sha=${base_sha}" >> "$GITHUB_OUTPUT"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          commit_message="$RUNNER_TEMP/extension-release-commit.txt"
          printf '%s\n' \
            "Keep changed extensions installable without manual packaging [extension-release]" \
            "" \
            "Generate ${RELEASE_COUNT} verified extension release(s): ${RELEASE_SUMMARY}." \
            "" \
            "Constraint: Automatic push releases use patch bumps; manual dispatch controls minor or major bumps" \
            "Constraint: Adding a source and installing its extension are explicit user trust decisions" \
            "Confidence: high" \
            "Scope-risk: moderate" \
            "Directive: Do not edit generated package or repository files by hand" \
            "Automation: extension-release" \
            "Tested: Selected extension typechecks, builds, tests, package assembly, catalog verification, and diff validation" \
            "Not-tested: Client refresh latency after GitHub Raw cache propagation" \
            > "$commit_message"
          git commit --file "$commit_message"
          release_head_sha="$(git rev-parse HEAD)"
          echo "head_sha=${release_head_sha}" >> "$GITHUB_OUTPUT"

      - name: Publish verified releases to the base branch
        id: publish
        if: steps.selection.outputs.release_count != '0'
        shell: bash
        env:
          BASE_BRANCH: ${{ env.RELEASE_BASE_BRANCH }}
          EXPECTED_BASE_SHA: ${{ steps.commit.outputs.base_sha }}
          RELEASE_HEAD_SHA: ${{ steps.commit.outputs.head_sha }}
          RELEASE_TAGS: ${{ steps.metadata.outputs.release_tags }}
        run: |
          git fetch --no-tags origin "$BASE_BRANCH"
          current_base_sha="$(git rev-parse FETCH_HEAD)"
          if [ "$current_base_sha" != "$EXPECTED_BASE_SHA" ]; then
            echo "::error::The base branch advanced while the releases were being built. The next main push or a manual rerun will include every extension still changed since its release baseline."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$EXPECTED_BASE_SHA" "$RELEASE_HEAD_SHA"; then
            echo "::error::The generated release commit is not based on the expected source revision."
            exit 1
          fi

          read -r -a release_tags <<< "$RELEASE_TAGS"
          if [ "${#release_tags[@]}" -eq 0 ]; then
            echo "::error::No release tags were prepared."
            exit 1
          fi
          for release_tag in "${release_tags[@]}"; do
            if git ls-remote --exit-code --tags origin "refs/tags/$release_tag" >/dev/null 2>&1; then
              echo "::error::Release tag $release_tag already exists. Extension versions are immutable; publish a new semantic version instead."
              exit 1
            fi
          done

          push_refs=("$RELEASE_HEAD_SHA:refs/heads/$BASE_BRANCH")
          for release_tag in "${release_tags[@]}"; do
            git tag --annotate "$release_tag" "$RELEASE_HEAD_SHA" --message "Release $release_tag"
            push_refs+=("refs/tags/$release_tag:refs/tags/$release_tag")
          done
          if ! git push --atomic origin "${push_refs[@]}"; then
            echo "::error::The verified release commit and tags could not be published atomically. If a branch rule blocks GitHub Actions, allow this workflow actor to update the branch or configure a RELEASE_PUBLISH_TOKEN owned by an allowed actor."
            exit 1
          fi

          git fetch --no-tags origin "$BASE_BRANCH"
          published_sha="$(git rev-parse FETCH_HEAD)"
          if [ "$published_sha" != "$RELEASE_HEAD_SHA" ]; then
            echo "::error::The base branch does not point to the verified release commit after publication."
            exit 1
          fi
          for release_tag in "${release_tags[@]}"; do
            published_tag_sha="$(git ls-remote --tags origin "refs/tags/$release_tag^{}" | awk '{print $1}')"
            if [ "$published_tag_sha" != "$RELEASE_HEAD_SHA" ]; then
              echo "::error::Release tag $release_tag does not resolve to the verified release commit."
              exit 1
            fi
          done
          echo "published_sha=${published_sha}" >> "$GITHUB_OUTPUT"
          echo "release_tags=${RELEASE_TAGS}" >> "$GITHUB_OUTPUT"

      - name: Delete obsolete generated release branches
        if: steps.selection.outputs.release_count != '0'
        shell: bash
        env:
          RELEASE_METADATA: ${{ runner.temp }}/extension-releases.json
        run: |
          while IFS=$'\t' read -r branch_slug extension_version; do
            release_prefix="automation/publish-${branch_slug}-v${extension_version}-"
            git ls-remote --heads origin "refs/heads/${release_prefix}*" \
              | awk '{print $2}' \
              | while IFS= read -r stale_ref; do
                  [ -n "$stale_ref" ] || continue
                  stale_branch="${stale_ref#refs/heads/}"
                  case "$stale_branch" in
                    "${release_prefix}"*)
                      git push origin --delete "$stale_branch"
                      ;;
                    *)
                      echo "::error::Refusing to delete unexpected branch: ${stale_branch}"
                      exit 1
                      ;;
                  esac
                done
          done < <(node -e '
            const document = require(process.env.RELEASE_METADATA);
            for (const release of document.releases) {
              process.stdout.write(release.branch_slug + "\t" + release.version + "\n");
            }
          ')

      - name: Summarize published releases
        if: steps.selection.outputs.release_count != '0'
        shell: bash
        env:
          RELEASE_METADATA: ${{ runner.temp }}/extension-releases.json
          BASE_BRANCH: ${{ env.RELEASE_BASE_BRANCH }}
          PUBLISHED_SHA: ${{ steps.publish.outputs.published_sha }}
        run: |
          node -e '
            const fs = require("node:fs");
            const document = require(process.env.RELEASE_METADATA);
            const lines = ["### Extensions published", ""];
            for (const release of document.releases) {
              lines.push(
                "- `" + release.extension_id + "`: `"
                  + (release.previous_version || "initial") + " -> " + release.version
                  + "` (`" + release.version_bump + "`), tag `" + release.release_tag + "`",
              );
            }
            lines.push(
              "- Collection sequence: `" + document.releases.at(-1).repository_sequence + "`",
              "- Published branch: `" + process.env.BASE_BRANCH + "`",
              "- Published commit: `" + process.env.PUBLISHED_SHA + "`",
              "- Obsolete generated branches for these versions: deleted",
              "",
            );
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join("\n"));
          '
