name: Publish extension

run-name: Publish ${{ inputs.extension_id }} (${{ inputs.version_bump }}) from ${{ inputs.base_branch }}

on:
  workflow_dispatch:
    inputs:
      extension_id:
        description: Extension ID beneath extensions/
        required: true
        default: org.substore.config-generator
        type: string
      base_branch:
        description: Branch containing the reviewed release source
        required: true
        default: main
        type: string
      version_bump:
        description: Semantic version increment calculated from the published catalog entry
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

concurrency:
  group: publish-extension-${{ inputs.base_branch }}
  cancel-in-progress: false

jobs:
  publish:
    name: Verify and publish extension
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out release source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.base_branch }}
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PUBLISH_TOKEN || github.token }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install locked dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Prepare release metadata
        id: metadata
        shell: bash
        run: |
          release_time="$(git show -s --format=%cI HEAD)"
          corepack pnpm release:prepare -- \
            --extension "${{ inputs.extension_id }}" \
            --bump "${{ inputs.version_bump }}" \
            --installed-at "$release_time" \
            --github-output "$GITHUB_OUTPUT"

      - name: Type-check extension
        run: >-
          corepack pnpm typecheck --
          --extension "${{ steps.metadata.outputs.extension_id }}"

      - name: Build extension
        run: >-
          corepack pnpm build --
          --extension "${{ steps.metadata.outputs.extension_id }}"

      - name: Assemble SHA-256 package
        run: >-
          corepack pnpm package:assemble --
          --extension "${{ steps.metadata.outputs.extension_id }}"

      - name: Publish collection catalog
        run: corepack pnpm repository

      - name: Test assembled release candidate
        run: >-
          corepack pnpm test:built --
          --extension "${{ steps.metadata.outputs.extension_id }}"

      - name: Verify release candidate
        run: |
          corepack pnpm verify
          git diff --check

      - name: Upload release candidate
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.metadata.outputs.branch_slug }}-v${{ steps.metadata.outputs.version }}
          path: |
            build/${{ steps.metadata.outputs.extension_id }}
            dist/packages/${{ steps.metadata.outputs.extension_id }}
            packages/${{ steps.metadata.outputs.extension_id }}
            repository/catalog.json
            repository/packages/${{ steps.metadata.outputs.extension_id }}
          if-no-files-found: error
          retention-days: 14

      - name: Commit release candidate
        id: commit
        shell: bash
        env:
          EXTENSION_ID: ${{ steps.metadata.outputs.extension_id }}
          EXTENSION_VERSION: ${{ steps.metadata.outputs.version }}
          PREVIOUS_VERSION: ${{ steps.metadata.outputs.previous_version }}
          VERSION_BUMP: ${{ steps.metadata.outputs.version_bump }}
          BRANCH_SLUG: ${{ steps.metadata.outputs.branch_slug }}
          REPOSITORY_SEQUENCE: ${{ steps.metadata.outputs.repository_sequence }}
        run: |
          if git diff --quiet; then
            echo "Release produced no tracked changes." >&2
            exit 1
          fi
          base_sha="$(git rev-parse HEAD)"
          echo "base_sha=${base_sha}" >> "$GITHUB_OUTPUT"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          commit_message="$RUNNER_TEMP/extension-release-commit.txt"
          printf '%s\n' \
            "Make ${EXTENSION_ID}@${EXTENSION_VERSION} installable from the collection source" \
            "" \
            "Generate the ${VERSION_BUMP} release from ${PREVIOUS_VERSION:-the initial source version}, including the SHA-256 package and collection catalog." \
            "" \
            "Constraint: Adding a source and installing its extension are explicit user trust decisions" \
            "Confidence: high" \
            "Scope-risk: moderate" \
            "Directive: Do not edit generated package or repository files by hand" \
            "Tested: Extension typecheck, build, tests, package assembly, catalog verification, and diff validation" \
            "Not-tested: Client refresh latency after GitHub Raw cache propagation" \
            > "$commit_message"
          git commit --file "$commit_message"
          release_head_sha="$(git rev-parse HEAD)"
          echo "head_sha=${release_head_sha}" >> "$GITHUB_OUTPUT"

      - name: Publish verified release to the base branch
        id: publish
        shell: bash
        env:
          BASE_BRANCH: ${{ inputs.base_branch }}
          EXPECTED_BASE_SHA: ${{ steps.commit.outputs.base_sha }}
          RELEASE_HEAD_SHA: ${{ steps.commit.outputs.head_sha }}
        run: |
          git fetch --no-tags origin "$BASE_BRANCH"
          current_base_sha="$(git rev-parse FETCH_HEAD)"
          if [ "$current_base_sha" != "$EXPECTED_BASE_SHA" ]; then
            echo "::error::The base branch advanced while the release was being built. Run the workflow again so the package and catalog are regenerated from the current source."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$EXPECTED_BASE_SHA" "$RELEASE_HEAD_SHA"; then
            echo "::error::The generated release commit is not based on the expected source revision."
            exit 1
          fi
          if ! git push origin "$RELEASE_HEAD_SHA:refs/heads/$BASE_BRANCH"; then
            echo "::error::The verified release could not be pushed to the base branch. If a branch rule blocks GitHub Actions, allow this workflow actor to update the branch or configure a RELEASE_PUBLISH_TOKEN owned by an allowed actor."
            exit 1
          fi
          git fetch --no-tags origin "$BASE_BRANCH"
          published_sha="$(git rev-parse FETCH_HEAD)"
          if [ "$published_sha" != "$RELEASE_HEAD_SHA" ]; then
            echo "::error::The base branch does not point to the verified release commit after publication."
            exit 1
          fi
          echo "published_sha=${published_sha}" >> "$GITHUB_OUTPUT"

      - name: Delete obsolete generated release branches
        shell: bash
        env:
          BRANCH_SLUG: ${{ steps.metadata.outputs.branch_slug }}
          EXTENSION_VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          release_prefix="automation/publish-${BRANCH_SLUG}-v${EXTENSION_VERSION}-"
          git ls-remote --heads origin "refs/heads/${release_prefix}*" \
            | awk '{print $2}' \
            | while IFS= read -r stale_ref; do
                [ -n "$stale_ref" ] || continue
                stale_branch="${stale_ref#refs/heads/}"
                case "$stale_branch" in
                  "${release_prefix}"*)
                    git push origin --delete "$stale_branch"
                    ;;
                  *)
                    echo "::error::Refusing to delete unexpected branch: ${stale_branch}"
                    exit 1
                    ;;
                esac
              done

      - name: Summarize published release
        shell: bash
        env:
          EXTENSION_ID: ${{ steps.metadata.outputs.extension_id }}
          EXTENSION_VERSION: ${{ steps.metadata.outputs.version }}
          PREVIOUS_VERSION: ${{ steps.metadata.outputs.previous_version }}
          VERSION_BUMP: ${{ steps.metadata.outputs.version_bump }}
          REPOSITORY_SEQUENCE: ${{ steps.metadata.outputs.repository_sequence }}
          BASE_BRANCH: ${{ inputs.base_branch }}
          PUBLISHED_SHA: ${{ steps.publish.outputs.published_sha }}
        run: |
          echo "### Extension published" >> "$GITHUB_STEP_SUMMARY"
          echo "- Extension: \`${EXTENSION_ID}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Version: \`${PREVIOUS_VERSION:-initial} -> ${EXTENSION_VERSION}\` (\`${VERSION_BUMP}\`)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Collection sequence: \`${REPOSITORY_SEQUENCE}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Published branch: \`${BASE_BRANCH}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Published commit: \`${PUBLISHED_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Obsolete generated branches for this version: deleted" >> "$GITHUB_STEP_SUMMARY"
